<!doctype html>
<html lang="de">
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Startseite</title>
    <style>
      body {
        margin: 0;
      }

      .top-nav {
        position: absolute;
        top: 20px;
        right: 25px;
        z-index: 10;
      }

      .top-nav ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      .top-nav a {
        display: block;
        color: white;
        text-decoration: none;
        font-family: sans-serif;
        font-size: 15px;
        background-color: black;
        padding: 10px 20px;
        border-radius: 10px;
      }

      .top-nav a:hover {
        text-decoration: underline;
      }

      .hero-text {
        position: absolute;
        top: 20px;
        left: 25px;
        color: black;
        font-size: 64px;
        font-family: "Henny Penny", cursive;
        margin: 0;
        z-index: 10;
      }

      .header-image {
        display: block;
        height: 100vh;
        width: 100%;
        object-fit: cover;
        filter: grayscale(40%) brightness(90%);
      }
     @media (max-width: 768px) {
  .hero-text {
    font-size: 26px;
    left: 15px;
    max-width: 50%;
  }

  .top-nav {
    top: 10px;
    right: 10px;
  }

  .top-nav a {
    font-size: 13px;
    padding: 8px 14px;
  }
}
    </style>
  </head>
  <body>
    <nav class="top-nav">
      <ul>
        <li><a href="#">Startseite</a></li>
        <li><a href="#">Kurse</a></li>
        <li><a href="#">So funktioniert's</a></li>
        <li><a href="#">Über mich</a></li>
        <li><a href="#">Kontakt</a></li>
        <li><a href="#">Login</a></li>
      </ul>
    </nav>
    <h2 class="hero-text">Mit links lernen</h2>
    <img class="header-image" src="img/background.jpg" />
  </body>
</html>
